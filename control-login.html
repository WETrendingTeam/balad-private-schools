<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>BALAD Control Login</title>
<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f5f8f6;
  font-family:Arial,sans-serif;
}

.card{
  width:100%;
  max-width:440px;
  background:#fff;
  border-radius:22px;
  padding:32px;
  box-shadow:0 12px 40px rgba(0,0,0,.08);
}

h1{
  margin:0 0 8px;
  color:#075c46;
}

p{
  color:#66736e;
  line-height:1.5;
}

label{
  display:block;
  font-weight:700;
  color:#075c46;
  margin:18px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #cbd8d2;
  border-radius:11px;
  font:inherit;
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#075c46;
  color:#fff;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.status{
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  display:block;
  line-height:1.45;
}

.success{
  background:#e8f7ef;
  color:#075c46;
}

.error{
  background:#fdecec;
  color:#a21b1b;
}

.info{
  background:#eef4f1;
  color:#075c46;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#075c46;
  text-decoration:none;
  font-size:14px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="card">
<h1>BALAD Control</h1>
<p>
    Restricted school administration.
    Sign in with your Control staff code and password.
  </p>
<form id="form" novalidate="">
<label for="code">
      Control Staff Code
    </label>
<input autocomplete="username" id="code" placeholder="Enter your Control staff code" required=""/>
<label for="password">
      Password
    </label>
<input autocomplete="current-password" id="password" placeholder="Enter your password" required="" type="password"/>
<button id="button" type="submit">
      Open Control Dashboard
    </button>
<div aria-live="polite" class="status info" id="status">
      Ready. Enter your Control staff code and password.
    </div>
</form>
<a class="back" href="index.html">
    ← Back to BALAD website
  </a>
</div>
<script>

(function(){

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("button");

  const form =
    document.getElementById("form");

  const codeInput =
    document.getElementById("code");

  const passwordInput =
    document.getElementById("password");


  /* =====================================================
     BALAD FIREBASE
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCLU7CdFlCrLxGzRo0Z0PQOQ-6Y91ccj-M",

    authDomain:
      "projectb-wetrending-space.firebaseapp.com",

    projectId:
      "projectb-wetrending-space",

    storageBucket:
      "projectb-wetrending-space.firebasestorage.app",

    messagingSenderId:
      "106348539335",

    appId:
      "1:106348539335:web:50ec676ce6d424a82c3de2"

  };


  /* =====================================================
     BALAD WORKER
  ===================================================== */

  const WORKER_URL =
    "https://balad-staff-auth.6s9257wftb.workers.dev";


  /* =====================================================
     INITIALIZE FIREBASE
  ===================================================== */

  let auth;

  try{

    firebase.initializeApp(
      firebaseConfig
    );

    auth =
      firebase.auth();

  }catch(error){

    console.error(
      "Firebase initialization error:",
      error
    );

    show(
      "Firebase could not be initialized on this page.",
      "error"
    );

    return;

  }


  /* =====================================================
     STATUS
  ===================================================== */

  function show(
    message,
    type
  ){

    status.textContent =
      message;

    status.className =
      "status " +
      (type || "info");

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  async function login(){

    const code =
      codeInput.value
        .trim()
        .toUpperCase();

    const password =
      passwordInput.value;


    if(
      !code ||
      !password
    ){

      show(
        "Enter your Control staff code and password.",
        "error"
      );

      return;

    }


    button.disabled =
      true;


    try{

      /* ===============================================
         FIREBASE LOGIN
      =============================================== */

      show(
        "Signing in to Firebase…",
        "info"
      );


      const email =
        code.toLowerCase() +
        "@staff.balad.local";


      const credential =
        await auth.signInWithEmailAndPassword(
          email,
          password
        );


      const user =
        credential.user;


      if(!user){

        throw new Error(
          "Firebase login did not return a user."
        );

      }


      console.log(
        "BALAD Firebase UID:",
        user.uid
      );

      console.log(
        "BALAD Firebase email:",
        user.email
      );


      /* ===============================================
         GET FRESH TOKEN
      =============================================== */

      show(
        "Firebase login successful. Checking Control access…",
        "info"
      );


      const token =
        await user.getIdToken(
          true
        );


      if(!token){

        throw new Error(
          "Firebase did not return an ID token."
        );

      }


      /* ===============================================
         ASK WORKER FOR STAFF DIRECTORY
      =============================================== */

      const response =
        await fetch(
          WORKER_URL +
          "/staff-admin",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " +
                token
            },

            body:
              JSON.stringify({
                action:"list"
              })
          }
        );


      const data =
        await response
          .json()
          .catch(
            function(){
              return {};
            }
          );


      console.log(
        "BALAD Worker response:",
        data
      );


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.error ||
          "Control verification failed. HTTP " +
          response.status
        );

      }


      /* ===============================================
         FIND STAFF PROFILE
         
         IMPORTANT:
         Different versions of the Worker may return
         the Firebase UID as:
         
         uid
         id
         firebaseUid
         authUid
         userId
      =============================================== */

      const staff =
        Array.isArray(data.staff)
          ? data.staff
          : [];


      const me =
        staff.find(
          function(item){

            const possibleUidValues = [

              item.uid,

              item.id,

              item.firebaseUid,

              item.authUid,

              item.userId

            ]
            .filter(Boolean)
            .map(
              value =>
                String(value)
            );


            return possibleUidValues
              .includes(
                String(user.uid)
              );

          }
        );


      /* ===============================================
         IF UID MATCH FAILED,
         TRY LOGIN CODE MATCH
         
         This is important because your existing
         Firestore staff record may use BAL001 etc.
      =============================================== */

      const profile =
        me ||
        staff.find(
          function(item){

            const possibleCodes = [

              item.loginCode,

              item.staffCode,

              item.code,

              item.id

            ]
            .filter(Boolean)
            .map(
              value =>
                String(value)
                  .trim()
                  .toUpperCase()
            );


            return possibleCodes
              .includes(
                code
              );

          }
        );


      console.log(
        "BALAD matched staff profile:",
        profile
      );


      /* ===============================================
         STAFF PROFILE NOT FOUND
      =============================================== */

      if(!profile){

        console.error(
          "Firebase UID:",
          user.uid
        );

        console.error(
          "Login code:",
          code
        );

        console.error(
          "Worker staff records:",
          staff
        );


        throw new Error(
          "Firebase login succeeded, but the Worker could not match this Firebase account to the Control staff record. Firebase UID: " +
          user.uid
        );

      }


      /* ===============================================
         CHECK ROLE
      =============================================== */

      const role =
        String(
          profile.role || ""
        )
        .trim()
        .toLowerCase();


      if(
        role !== "control"
      ){

        throw new Error(
          "This Firebase account exists, but its staff role is '" +
          (
            profile.role ||
            "not set"
          ) +
          "'. It must be 'control'."
        );

      }


      /* ===============================================
         CHECK ACTIVE
      =============================================== */

      if(
        profile.active !== true
      ){

        throw new Error(
          "This Control staff account exists but is inactive."
        );

      }


      /* ===============================================
         SAVE SESSION
      =============================================== */

      sessionStorage.setItem(
        "baladControlUid",
        user.uid
      );


      sessionStorage.setItem(
        "baladControlLoginCode",
        code
      );


      sessionStorage.setItem(
        "baladControlVerified",
        "true"
      );


      /* ===============================================
         SUCCESS
      =============================================== */

      show(
        "Control verified. Opening dashboard…",
        "success"
      );


      /*
         IMPORTANT:
         Give Firebase a moment to finish persisting
         the authenticated session before navigation.
      */

      setTimeout(
        function(){

          window.location.href =
            "control-dashboard.html";

        },
        300
      );

    }


    catch(error){

      console.error(
        "BALAD Control login error:",
        error
      );


      const firebaseCode =
        error &&
        error.code
          ? error.code
          : "";


      let message =
        error &&
        error.message
          ? error.message
          : "Unable to sign in.";


      /* ===============================================
         FIREBASE LOGIN ERRORS
      =============================================== */

      if(
        firebaseCode.includes(
          "invalid-credential"
        ) ||
        firebaseCode.includes(
          "user-not-found"
        ) ||
        firebaseCode.includes(
          "wrong-password"
        ) ||
        firebaseCode.includes(
          "invalid-login-credentials"
        )
      ){

        message =
          "The Control staff code or password is incorrect.";

      }


      else if(
        firebaseCode.includes(
          "unauthorized-domain"
        )
      ){

        message =
          "Firebase blocked this website domain. Add the domain under Firebase Authentication → Settings → Authorized domains.";

      }


      else if(
        firebaseCode.includes(
          "network-request-failed"
        )
      ){

        message =
          "The browser could not reach Firebase. Check your internet connection.";

      }


      else if(
        /Failed to fetch/i.test(
          message
        ) ||
        /Load failed/i.test(
          message
        )
      ){

        message =
          "The browser could not reach the BALAD Worker. Check the Worker URL and deployment.";

      }


      show(
        message,
        "error"
      );


      button.disabled =
        false;

    }

  }


  /* =====================================================
     SUBMIT
  ===================================================== */

  form.addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      login();

    }
  );


})();

</script>
</body>
</html>
