<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BALAD Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f8f6;color:#17211d}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:520px;background:#fff;border:1px solid #dbe5e0;border-radius:22px;padding:42px 34px;box-shadow:0 12px 40px rgba(7,65,45,.08);text-align:center}
h1{margin:0 0 28px;color:#075c46;font-size:34px;line-height:1.1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a{display:flex;align-items:center;justify-content:center;min-height:68px;padding:14px 18px;border:2px solid #075c46;border-radius:12px;text-decoration:none;color:#075c46;background:#fff;font-size:20px;font-weight:800}
a:first-child{background:#075c46;color:#fff}
a:last-child{border-color:#c5222d;color:#c5222d}
a:hover{opacity:.92}
@media(max-width:600px){.card{max-width:440px;padding:38px 26px}.actions{grid-template-columns:1fr}h1{font-size:30px;margin-bottom:24px}a{min-height:64px;font-size:19px}}
</style>
</head>
<body>
<main class="card">
<h1>BALAD LOGIN</h1>
<div class="actions">
<a href="control-login.html">Control</a>
<a href="staff/staff-login.html">Staff</a>
<a href="security-login.html">Security Access</a>
</div>
</main>
</body>
</html>
