<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Class | BALAD</title>
<style>
:root{--green:#075c46;--red:#e32629;--ink:#17211d;--muted:#66716c;--line:#dbe5e0;--soft:#f4f8f6}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8f6;color:var(--ink)}header{background:var(--green);color:#fff;padding:18px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:20px;margin:0}.head p{font-size:12px;margin:4px 0 0;opacity:.85}.head a,.head button{background:#fff;color:var(--green);border:0;border-radius:9px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:22px 18px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(7,65,45,.06)}h2{color:var(--green);margin:0 0 12px}.muted{color:var(--muted);line-height:1.5}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;font-size:13px;color:#34423b}input,select{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}button.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.photo{display:flex;gap:14px;align-items:center}.preview{width:78px;height:78px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--soft)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{padding:10px 12px;border-radius:10px;background:#e8f7ef;color:var(--green);display:none}.error{background:#fdecec;color:#b42323}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--green);background:var(--soft)}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft)}.edit{background:#fff;border:1px solid var(--green);color:var(--green);border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}

.photo-picker{position:relative;flex:1}.photo-choice-row{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0}.photo-choice{border:1px solid var(--green);background:#fff;color:var(--green);border-radius:9px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}.photo-choice:active{opacity:.8}.photo-hidden{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important}</style></head><body>
<header><div class="head"><div><h1>BALAD PRIVATE SCHOOLS</h1><p>My Class Management</p></div><div><a href="staff-dashboard.html">← Staff Dashboard</a></div></div></header>
<main class="wrap">
<section class="card"><h2 id="title">My Class</h2><p class="muted" id="intro">Loading your Class Teacher assignment…</p></section>
<section class="card"><h2>Create Student</h2><form id="createForm" class="form">
<div><label>Student Name<input id="studentName" required></label></div><div><label>Admission Number<input id="admissionNumber" required></label></div>
<div><label>Gender<select id="gender"><option value="">Select</option><option>Male</option><option>Female</option></select></label></div><div><label>Date of Birth<input id="dob" type="date"></label></div>
<div><label>Guardian Name<input id="guardianName"></label></div><div><label>Guardian Phone<input id="guardianPhone"></label></div>
<div class="full"><label>Address<input id="address"></label></div>
<div class="full photo"><img id="preview" class="preview" src="../images/logo.png" alt="Passport preview"><div class="photo-picker"><label>Choose Photo</label><div class="photo-choice-row"><button type="button" class="photo-choice" id="takePhoto">Take Photo</button><button type="button" class="photo-choice" id="photoLibrary">Photo Library</button><button type="button" class="photo-choice" id="browseFiles">Browse Files</button></div><input id="photo" type="file" accept="image/*" class="photo-hidden"><input id="photoCamera" type="file" accept="image/*" capture="environment" class="photo-hidden"><input id="photoFiles" type="file" class="photo-hidden"><div class="muted">Choose from Camera, Photos or Files. Photo is uploaded to this student's private record.</div></div></div>
<div class="full"><button class="primary" type="submit" id="createBtn">Create Student</button></div></form><div id="createStatus" class="status"></div></section>
<section class="card"><div class="toolbar"><h2 style="margin-right:auto">Students in My Class</h2><button class="primary" id="refreshBtn" type="button">Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Photo</th><th>Name</th><th>Admission No.</th><th>Gender</th><th>Action</th></tr></thead><tbody id="students"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><div id="listStatus" class="status"></div></section>
<section class="card" id="editCard" style="display:none"><h2>Edit Student</h2><form id="editForm" class="form"><input id="editId" type="hidden"><div><label>Student Name<input id="editName" required></label></div><div><label>Admission Number<input id="editAdmission" required></label></div><div><label>Gender<select id="editGender"><option value="">Select</option><option>Male</option><option>Female</option></select></label></div><div><label>Date of Birth<input id="editDob" type="date"></label></div><div><label>Guardian Name<input id="editGuardian"></label></div><div><label>Guardian Phone<input id="editPhone"></label></div><div class="full"><label>Address<input id="editAddress"></label></div><div class="full"><label>Change Passport Photo<input id="editPhoto" type="file" accept="image/*"></label></div><div class="full"><button class="primary" type="submit" id="editBtn">Save Changes</button></div></form><div id="editStatus" class="status"></div></section>
</main>
<script type="module">
import {auth} from "../firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";
const API="https://balad-staff-auth.6s9257wftb.workers.dev"; const storage=getStorage();
let session=null, className="", school="college", students=[];
function getSession(){try{return JSON.parse(sessionStorage.getItem("staffSession")||"null")}catch{return null}}
function token(){return session?.accessToken||sessionStorage.getItem("baladStaffIdToken")||""}
async function worker(action,payload={}){const t=token();if(!t)throw Error("Your staff session has expired. Please log in again.");const r=await fetch(API+"/staff-admin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||"Request failed.");return d}
function msg(id,text,error=false){const e=document.getElementById(id);e.textContent=text;e.className="status"+(error?" error":"");e.style.display="block"}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function ownClass(){const raw=JSON.parse(sessionStorage.getItem("staffSession")||"null");return raw?.homeroom||""}
async function load(){
 session=getSession(); if(!session){location.href="staff-login.html";return}
 if(String(session.role||"").toLowerCase()!=="class_teacher"){alert("This page is only available to Class Teachers.");location.href="staff-dashboard.html";return}
 className=ownClass(); school=String(session.school||"college").toLowerCase(); if(school==="secondary")school="college";
 if(!className){alert("No Class Teacher Of class is assigned to this account.");location.href="staff-dashboard.html";return}
 document.getElementById("title").textContent=`My Class — ${className}`; document.getElementById("intro").textContent=`You can manage student profiles for ${className} only.`;
 await list();
}
async function list(){try{const d=await worker("list_students",{school,className});students=d.students||[];render();}catch(e){document.getElementById("students").innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;}}
function render(){document.getElementById("students").innerHTML=students.length?students.map(s=>`<tr><td>${s.passportUrl?`<img class="thumb" src="${esc(s.passportUrl)}">`:`—`}</td><td>${esc(s.studentName)}</td><td>${esc(s.admissionNumber)}</td><td>${esc(s.gender||"—")}</td><td><button class="edit" data-id="${esc(s.studentId)}">Edit</button></td></tr>`).join(""):`<tr><td colspan="5">No students in ${esc(className)} yet.</td></tr>`;document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>openEdit(b.dataset.id));}
async function upload(file,studentId){if(!file)return "";const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";const r=ref(storage,`students/passports/${studentId}/${Date.now()}.${ext}`);await uploadBytes(r,file);return await getDownloadURL(r)}
document.getElementById("createForm").onsubmit=async e=>{e.preventDefault();document.getElementById("createBtn").disabled=true;try{const d=await worker("create_student",{school,className,student:{school,className,studentName:document.getElementById("studentName").value.trim(),admissionNumber:document.getElementById("admissionNumber").value.trim(),gender:document.getElementById("gender").value,dateOfBirth:document.getElementById("dob").value,guardianName:document.getElementById("guardianName").value.trim(),guardianPhone:document.getElementById("guardianPhone").value.trim(),address:document.getElementById("address").value.trim()}});const st=d.student;if(document.getElementById("photo").files[0]){const url=await upload(document.getElementById("photo").files[0],st.studentId);await worker("update_student",{studentId:st.studentId,updates:{passportUrl:url}})}document.getElementById("createForm").reset();document.getElementById("preview").src="../images/logo.png";msg("createStatus",`${st.studentName} was created successfully.`);await list()}catch(e){msg("createStatus",e.message,true)}finally{document.getElementById("createBtn").disabled=false}}
function setChosenPhoto(file){if(!file)return;const dt=new DataTransfer();dt.items.add(file);document.getElementById("photo").files=dt.files;document.getElementById("preview").src=URL.createObjectURL(file)}function chooseFrom(input){const f=input.files&&input.files[0];if(f)setChosenPhoto(f)}document.getElementById("takePhoto").onclick=()=>document.getElementById("photoCamera").click();document.getElementById("photoLibrary").onclick=()=>document.getElementById("photo").click();document.getElementById("browseFiles").onclick=()=>document.getElementById("photoFiles").click();document.getElementById("photo").onchange=()=>chooseFrom(document.getElementById("photo"));document.getElementById("photoCamera").onchange=()=>chooseFrom(document.getElementById("photoCamera"));document.getElementById("photoFiles").onchange=()=>chooseFrom(document.getElementById("photoFiles"));
async function openEdit(id){const d=students.find(x=>x.studentId===id);if(!d)return;document.getElementById("editCard").style.display="block";document.getElementById("editId").value=d.studentId;document.getElementById("editName").value=d.studentName||"";document.getElementById("editAdmission").value=d.admissionNumber||"";document.getElementById("editGender").value=d.gender||"";document.getElementById("editDob").value=d.dateOfBirth||"";document.getElementById("editGuardian").value=d.guardianName||"";document.getElementById("editPhone").value=d.guardianPhone||"";document.getElementById("editAddress").value=d.address||"";document.getElementById("editCard").scrollIntoView({behavior:"smooth"})}
document.getElementById("editForm").onsubmit=async e=>{e.preventDefault();document.getElementById("editBtn").disabled=true;try{const updates={studentName:document.getElementById("editName").value.trim(),admissionNumber:document.getElementById("editAdmission").value.trim(),gender:document.getElementById("editGender").value,dateOfBirth:document.getElementById("editDob").value,guardianName:document.getElementById("editGuardian").value.trim(),guardianPhone:document.getElementById("editPhone").value.trim(),address:document.getElementById("editAddress").value.trim(),className};if(document.getElementById("editPhoto").files[0])updates.passportUrl=await upload(document.getElementById("editPhoto").files[0],document.getElementById("editId").value);await worker("update_student",{studentId:document.getElementById("editId").value,updates});msg("editStatus","Student profile updated successfully.");await list()}catch(e){msg("editStatus",e.message,true)}finally{document.getElementById("editBtn").disabled=false}};
document.getElementById("refreshBtn").onclick=list; onAuthStateChanged(auth,()=>{}); load();
</script></body></html>
