<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Student Result | BALAD</title><style>body{margin:0;background:#eee3c7;font-family:Arial,Helvetica,sans-serif;color:#17221e}.access{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.access-card{width:min(440px,100%);background:#fff;padding:35px;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.12);text-align:center}.access-card img{width:85px;height:85px;object-fit:contain}.access-card h1{color:#075c43;font-size:25px}.access-card p{color:#666;line-height:1.5}.access-card input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bbb;border-radius:8px;font-size:16px;margin:12px 0}.access-card button{width:100%;padding:14px;background:#075c43;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:bold}.error{color:#a61d1d;background:#fdecec;padding:12px;border-radius:8px;margin-top:12px}</style><script src="content-loader.js" type="module"></script></head><body data-cms-page="student-result"><div class="access"><div class="access-card"><img alt="BALAD Logo" data-media-key="student-result-image-1" src="images/logo.png"/><h1 id="accessTitle">Student Result</h1><p>Enter the student's <b>Result Access Code</b> to view the finalized result.</p><input autocomplete="off" id="accessCode" placeholder="Result Access Code"/><button id="accessBtn">View Result</button><div id="accessError"></div></div></div><script>
const API_URL="https://balad-staff-auth.6s9257wftb.workers.dev";
const params=new URLSearchParams(location.search);const selectedSchool=params.get("school")==="primary"?"primary":"college";
const accessTitle=document.getElementById("accessTitle");accessTitle.textContent=selectedSchool==="primary"?"BALAD NURSERY AND PRIMARY SCHOOLS":"BALAD COMPREHENSIVE COLLEGE";
function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function openTemplate(data){sessionStorage.setItem("baladResultPayload",JSON.stringify(data));const sec=data.section||"senior";location.href="result-templates/"+(sec==="primary"?"balad_nursery_result.html":sec==="junior"?"balad_comprehensive_junior_result.html":"balad_comprehensive_senior_result.html");}
async function openResult(){const code=document.getElementById("accessCode").value.trim();const err=document.getElementById("accessError");err.innerHTML="";if(!code){err.innerHTML='<div class="error">Enter the Result Access Code.</div>';return}const btn=document.getElementById("accessBtn");btn.disabled=true;btn.textContent="Verifying...";try{const r=await fetch(API_URL+"/results",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"get_student_results_by_access_code",accessCode:code,school:selectedSchool})});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.error||"Unable to load result.");data.accessCode=code;openTemplate(data);}catch(e){err.innerHTML='<div class="error">'+esc(e.message)+"</div>"}finally{btn.disabled=false;btn.textContent="View Result"}}
document.getElementById("accessBtn").addEventListener("click",openResult);document.getElementById("accessCode").addEventListener("keydown",e=>{if(e.key==="Enter")openResult()});
</script><section class="cms-public-content-wrap"><div class="cms-public-content" data-cms-page="student-result" id="cms-page-content"></div></section><footer>
  <div class="footer-bottom">
    © <span data-year></span> BALAD Private Schools. All Rights Reserved.
    <div class="site-footer-developer">
      <details>
        <summary>Developer Control</summary>
        <div class="developer-panel">@lade</div>
      </details>
    </div>
  </div>
</footer>
</body></html>
